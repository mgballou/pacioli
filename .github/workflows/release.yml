# .github/workflows/release.yml
#
# Runs only when a version tag is pushed: `v` then a digit, as `v0.1.0`. It runs
# the full CI suite on the tagged commit, builds the binaries and the image
# stamped with the tag, and publishes nothing unless every step before the push
# succeeded.
name: release

on:
  push:
    tags: ['v[0-9]*']

env:
  # Where the image goes. The tag is appended, as `$IMAGE:v0.1.0`.
  IMAGE: ghcr.io/mgballou/pacioli

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        run: make dist VERSION="$VERSION"

      - name: Build the image
        run: make image IMAGE="$IMAGE" VERSION="$VERSION" REVISION="$GITHUB_SHA"

      - name: Check the image reports the tag
        run: test "$(docker run --rm "$IMAGE:$VERSION" version)" = "$VERSION"

      - name: Push the image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login "${IMAGE%%/*}" -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"

      - name: Attach the binaries to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag --title "$VERSION" --generate-notes
