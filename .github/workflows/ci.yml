name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fails, rather than skips, a PR behind its base: a run whose jobs were all
  # skipped concludes success, which reads as a pass.
  gate:
    if: github.event.pull_request.draft == false
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the branch to be current with its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by)
          if [ "$behind" != "0" ]; then
            echo "::error::This branch is $behind commits behind $BASE. Update it to run CI."
            exit 1
          fi

  check:
    needs: gate
    name: build, vet, staticcheck, race tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `make build` stamps the version from `git describe`. With no tags
          # in the repository a single-commit clone stamps the same short SHA,
          # so this is for the first tag: `describe --tags` cannot name one
          # without the history behind it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: fmt
        run: make fmt

      - name: build
        run: make build

      - name: vet
        run: make vet

      - name: staticcheck
        run: make lint

      # `make test` brings the compose database up first, so CI runs the exact
      # command a laptop runs. A `services:` block would be a second, divergent
      # definition of the same database.
      - name: test (race, against the container database)
        run: make test

      - name: database logs
        if: failure()
        run: docker compose -f compose.test.yaml logs postgres

      - name: stop the database
        if: always()
        run: make db-down

  controls:
    needs: gate
    name: every declared negative control goes red
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: every declared negative control goes red
        run: make negative-controls

      - name: stop the database
        if: always()
        run: make db-down

  compose:
    needs: gate
    name: the README's compose path, from a clean state
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script reads its curl out of README.md and fails if the README stops
      # showing either command, so an edit to one has to carry the other.
      - name: docker compose up, then curl the trial balance
        run: make compose-smoke

      - name: take the stack down
        if: always()
        run: docker compose -p pacioli-smoke down --volumes --remove-orphans
