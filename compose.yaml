# `docker compose up` serves the ledger on 127.0.0.1:8080.
#
# The test database is compose.test.yaml, which the Makefile targets with -f.
# That one is a tmpfs with fsync off and is thrown away every run. This one
# keeps a volume, because a ledger you can restart is the point.
#
# The two carry different project names and different ports, so both can be up
# at once and `make db-down` cannot reach in here.

name: pacioli

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pacioli
      POSTGRES_PASSWORD: pacioli
      POSTGRES_DB: pacioli
    volumes:
      # A real volume, not a tmpfs: this database is meant to survive a restart.
      - pgdata:/var/lib/postgresql
    ports:
      # 55433, one past the test database, so neither can reach the other and
      # neither can reach a Postgres already on 5432.
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacioli -d pacioli"]
      interval: 1s
      timeout: 3s
      retries: 30

  ledger:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEDGER_DSN: postgres://pacioli:pacioli@postgres:5432/pacioli?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
